<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT Lookup</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
    }
    button {
      width: 68px;
      height: 68px;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      background: #0969da;
      color: #fff;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      font: 600 26px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover {
      transform: scale(1.06);
      box-shadow: 0 5px 16px rgba(0, 0, 0, 0.38);
    }
    button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -6px;
    }
  </style>
</head>
<body>
  <button id="restoreButton" type="button" title="展开 JLPT Lookup" aria-label="展开 JLPT Lookup">あ</button>
  <script>
    document.getElementById('restoreButton').addEventListener('click', () => {
      window.api.restoreMainWindow();
    });
  </script>
</body>
</html>
