<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT Lookup</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }
    body {
      display: grid;
      place-items: center;
    }
    #bubble {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      border: 2px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      background: #0969da;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.62);
      user-select: none;
      touch-action: none;
      transition: opacity 125ms ease-out, transform 125ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    body.entering #bubble {
      opacity: 1;
      transform: scale(1);
    }
    body.interactive #bubble {
      pointer-events: auto;
    }
    body.leaving #bubble {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.62);
    }
    button {
      width: 46px;
      height: 46px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font: 600 26px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: -3px;
    }
  </style>
</head>
<body>
  <div id="bubble" title="拖动图标移动，单击展开">
    <button id="restoreButton" type="button" title="展开 JLPT Lookup" aria-label="展开 JLPT Lookup">あ</button>
  </div>
  <script>
    window.api.onCompactWindowEnter(() => {
      document.body.classList.remove('leaving', 'interactive');
      document.body.classList.add('entering');
      drag = null;
      suppressClick = false;
    });
    window.api.onCompactWindowReady(() => document.body.classList.add('interactive'));
    window.api.onCompactWindowLeave(() => document.body.classList.add('leaving'));
    const bubble = document.getElementById('bubble');
    let drag = null;
    let suppressClick = false;

    bubble.addEventListener('pointerdown', event => {
      if (event.button !== 0 || drag) return;
      suppressClick = false;
      drag = {
        pointerId: event.pointerId,
        screenX: event.screenX,
        screenY: event.screenY,
        windowX: window.screenX,
        windowY: window.screenY
      };
      bubble.setPointerCapture(event.pointerId);
    });

    bubble.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const dx = event.screenX - drag.screenX;
      const dy = event.screenY - drag.screenY;
      if (!suppressClick && Math.hypot(dx, dy) < 4) return;
      suppressClick = true;
      window.api.moveCompactWindow({
        x: Math.round(drag.windowX + dx),
        y: Math.round(drag.windowY + dy)
      });
    });

    function finishDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      if (event.type === 'pointercancel') suppressClick = true;
      drag = null;
    }

    bubble.addEventListener('pointerup', finishDrag);
    bubble.addEventListener('pointercancel', finishDrag);
    bubble.addEventListener('lostpointercapture', finishDrag);
    bubble.addEventListener('click', event => {
      if (event.detail === 0 || !suppressClick) window.api.restoreMainWindow();
    });
  </script>
</body>
</html>
